apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: production
data:
  nginx.conf: |
    events { worker_connections 1024; }
    http {
        server {
            listen 80;

            location / {
                # Intercept requests and verify via auth-service
                auth_request /verify;
                
                return 200 'Hello from Authenticated GitOps Nginx!\n';
                add_header Content-Type text/plain;
            }

            location = /verify {
                internal;
                proxy_pass http://auth-service.production.svc.cluster.local:80/;
                proxy_pass_request_body off;
                proxy_set_header Content-Length "";
                proxy_set_header X-Original-URI $request_uri;
            }
        }
    }
