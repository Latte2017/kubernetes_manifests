events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        
        location / {
            return 200 'Hello from Custom GitOps Nginx Configuration!\n';
            add_header Content-Type text/plain;
        }
        
        location /healthz {
            return 200 'healthy\n';
            add_header Content-Type text/plain;
        }
    }
}
